name: Site incele

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/explore.js"
      - ".github/workflows/explore.yml"

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Playwright kur
        run: |
          cd tools
          npm init -y > /dev/null
          npm i playwright@1.48.2 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
      - name: Siteyi gez
        run: |
          cd tools
          node explore.js ../dump || true
          ls -la ../dump
          cat ../dump/log.txt || true
          # API tarayicisiz (duz istekle) calisiyor mu?
          for h in t10f-configurator t10x-configurator t10f T10F-configurator; do
            curl -s -o ../dump/curl-$h.json -w "$h %{http_code} %{size_download}\n" "https://bff.dfs.togg.cloud/smart-device-products/TUR/getSmartDeviceProducts/v1?collectionHandle=$h" | tee -a ../dump/curl.txt
          done
      - name: Sonuclari site-dump dalina yaz
        run: |
          git config user.name "toggrobot-bot"
          git config user.email "toggrobot-bot@users.noreply.github.com"
          mv dump /tmp/dump
          git checkout --orphan site-dump
          git rm -rf . > /dev/null
          cp -r /tmp/dump/. .
          git add -A
          git commit -m "Site dokumu ${{ github.run_number }}" > /dev/null
          git push -f origin site-dump
