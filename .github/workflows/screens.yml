name: Ekran goruntuleri

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/screens.yml"

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Derle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon assembleRelease
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulatorde calistir ve ekran goruntusu al
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/screens.sh
      - name: Goruntuleri screens dalina yaz
        if: always()
        run: |
          git config user.name "toggrobot-bot"
          git config user.email "toggrobot-bot@users.noreply.github.com"
          mkdir -p /tmp/shots && cp -r shots/. /tmp/shots/ 2>/dev/null || true
          git checkout --orphan screens
          git rm -rf . > /dev/null
          cp -r /tmp/shots/. .
          git add -A
          git commit -m "Ekran goruntuleri ${{ github.run_number }}" > /dev/null || true
          git push -f origin screens
